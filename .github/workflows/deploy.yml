name: Deploy to Vercel

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Selects the GitHub Environment (and thus its secrets/variables):
    # main -> production, staging -> staging, pull requests -> preview.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/dev' && 'dev' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    # Fork PRs have no access to secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            project_id_var: VERCEL_BACKEND_PROJECT_ID
          - app: frontend
            project_id_var: VERCEL_FRONTEND_PROJECT_ID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest

      - name: Set target
        run: |
          case "${{ github.event_name }}:${{ github.ref_name }}" in
            push:main)    echo "TARGET=production" >> "$GITHUB_ENV"
                          echo "DEPLOY_FLAGS=--prod" >> "$GITHUB_ENV" ;;
            push:staging) echo "TARGET=staging" >> "$GITHUB_ENV"
                          echo "DEPLOY_FLAGS=--target=staging" >> "$GITHUB_ENV" ;;
            *)            echo "TARGET=preview" >> "$GITHUB_ENV"
                          echo "DEPLOY_FLAGS=" >> "$GITHUB_ENV" ;;
          esac

      - name: Pull Vercel settings
        env:
          VERCEL_PROJECT_ID: ${{ vars[matrix.project_id_var] }}
        run: vercel pull --yes --environment=$TARGET --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_PROJECT_ID: ${{ vars[matrix.project_id_var] }}
        run: vercel build $DEPLOY_FLAGS --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        env:
          VERCEL_PROJECT_ID: ${{ vars[matrix.project_id_var] }}
        run: |
          url=$(vercel deploy --prebuilt $DEPLOY_FLAGS --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.app }} ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Preview (${{ matrix.app }}): ${{ steps.deploy.outputs.url }}`,
            });
